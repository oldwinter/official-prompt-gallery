name: Check static gallery

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.8.1"
      - name: Check JavaScript syntax
        run: |
          node --check assets/image-inspector.js
          node --check scripts/validate.mjs
          node --check scripts/capture.mjs
      - name: Validate authoring projection
        run: node scripts/validate.mjs --mode authoring
      - name: Run offline smoke fixture
        run: node scripts/fixtures/smoke.mjs
